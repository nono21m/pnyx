<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pnyx — De la Pnyx au pixel</title>
<meta name="description" content="Pnyx : l'évolution historique des sociétés, d'Athènes à aujourd'hui. Carte, frise, thèmes, quiz.">
<meta name="theme-color" content="#F4EDE1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#F4EDE1;--card:#fffdf8;--fg:#1d1d1b;--mut:#6b6458;--li:#e2d9c8;--ac:#1F4E79;--t:#C0562F;--land:#e9e0cf;--sea:#dfe8ee}
@media(prefers-color-scheme:dark){:root{--bg:#17150f;--card:#221f18;--fg:#efe9dc;--mut:#a69e8e;--li:#3a352a;--ac:#8db8e8;--land:#3a352a;--sea:#1e2a33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px}
header svg{width:34px;height:34px}
header h1{font:700 1.25rem Georgia,serif;margin:0}header small{color:var(--mut);display:block;font-size:.75rem}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:0 12px 16px}.view.on{display:block}
nav.bar{display:flex;border-top:1px solid var(--li);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav.bar button{flex:1;border:0;background:none;color:var(--mut);font:600 .72rem system-ui;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button span{font-size:1.2rem;line-height:1}nav.bar button.on{color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--li);background:var(--card);color:var(--fg);border-radius:14px;padding:4px 10px;font:600 .75rem system-ui;display:flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}.chip.off{opacity:.4}.chip.sel{background:var(--fg);color:var(--bg)}
#mapwrap{position:relative;border-radius:14px;overflow:hidden;background:var(--sea);touch-action:none;border:1px solid var(--li)}
#map{width:100%;display:block;height:min(46vh,100vw,520px)}
#map .c{fill:var(--land);stroke:var(--bg);stroke-width:.4}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button,.ctl button{border:1px solid var(--li);background:var(--card);color:var(--fg);border-radius:10px;min-width:34px;height:34px;font:700 1rem system-ui}
.ctl{display:flex;align-items:center;gap:8px;margin:8px 0}.ctl input{flex:1;accent-color:var(--t)}
#ylab{font:700 1rem Georgia,serif;min-width:118px;text-align:center}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.small{font-size:.8rem;color:var(--mut)}
.legend{display:flex;gap:12px;font-size:.72rem;color:var(--mut);flex-wrap:wrap;margin-top:4px}
.legend b{display:inline-block;width:18px;border-top:2px solid #555;vertical-align:middle;margin-right:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .25s;z-index:5;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}#sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--li)}
#sheet .hd h2{margin:0;font:700 1.05rem Georgia,serif}#sheet .bd{overflow:auto;padding:4px 14px 14px}
#sheet .x{border:0;background:var(--li);color:var(--fg);border-radius:50%;width:30px;height:30px;font-size:1rem}
.ev{border-left:4px solid var(--li);padding:6px 10px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.ev h3{margin:0;font:700 .98rem Georgia,serif}.ev .y{font:700 .78rem system-ui;color:var(--mut)}
.ev p{margin:4px 0}.ev.fut{opacity:.45}.ev.hl{box-shadow:0 0 0 2px var(--t)}
.badge{font:700 .66rem system-ui;border-radius:8px;padding:1px 6px;background:var(--li);color:var(--fg);margin-right:4px}
.badge.deb{background:#f3d9a4;color:#5a3b00}
.lk{border:0;background:none;color:var(--ac);font:600 .8rem system-ui;padding:2px 0;text-align:left;display:block}
.lk.c{color:#C62F3F}.lk.d{color:var(--mut)}
.era{font:700 .8rem system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--t);margin:16px 0 0}
.card{background:var(--card);border:1px solid var(--li);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 4px;font:700 1rem Georgia,serif}
h2.sec{font:700 1.05rem Georgia,serif;margin:14px 0 4px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--li);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;margin:6px 0;font:.95rem system-ui}
.opt.ok{border-color:#2e7d32;background:rgba(46,125,50,.12)}.opt.ko{border-color:#C62F3F;background:rgba(198,47,63,.1)}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px;font:700 .9rem system-ui}
#syn table{border-collapse:collapse;font-size:.8rem;display:block;overflow-x:auto}#syn td,#syn th{border:1px solid var(--li);padding:4px 6px;vertical-align:top}
#syn h2{font:700 1.05rem Georgia,serif;color:var(--ac)}#syn a,.card a{color:var(--ac);word-break:break-all}
</style>
</head>
<body>
<header>
<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="44" fill="#F4EDE1"/><path d="M30 146 A70 70 0 0 1 170 146" fill="none" stroke="#C0562F" stroke-width="8" stroke-linecap="round"/><path d="M48 146 A52 52 0 0 1 152 146" fill="none" stroke="#C0562F" stroke-width="8" stroke-linecap="round"/><path d="M66 146 A34 34 0 0 1 134 146" fill="none" stroke="#1d1d1b" stroke-width="8" stroke-linecap="round"/><rect x="91" y="132" width="18" height="14" fill="#1d1d1b"/><rect x="50" y="22" width="52" height="32" rx="12" fill="#C0562F"/><polygon points="64,53 58,66 78,53" fill="#C0562F"/><rect x="98" y="34" width="52" height="32" rx="12" fill="#1F4E79"/><polygon points="136,65 144,78 124,65" fill="#1F4E79"/><circle cx="66" cy="38" r="3.4" fill="#F4EDE1"/><circle cx="76" cy="38" r="3.4" fill="#F4EDE1"/><circle cx="86" cy="38" r="3.4" fill="#F4EDE1"/><circle cx="114" cy="50" r="3.4" fill="#F4EDE1"/><circle cx="124" cy="50" r="3.4" fill="#F4EDE1"/><circle cx="134" cy="50" r="3.4" fill="#F4EDE1"/><line x1="22" y1="178" x2="178" y2="178" stroke="#1d1d1b" stroke-width="3"/><path d="M26 178 V160 H42 V172 H32 V166 H37" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/><path d="M48 178 V160 H64 V172 H54 V166 H59" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/><path d="M70 178 V160 H86 V172 H76 V166 H81" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/><path d="M92 178 V160 H108 V172 H98 V166 H103" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/><path d="M114 178 V160 H130 V172 H120 V166 H125" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/><path d="M136 178 V160 H152 V172 H142 V166 H147" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/><path d="M158 178 V160 H174 V172 H164 V166 H169" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="miter"/></svg>
<div><h1>Pnyx</h1><small>De la Pnyx au pixel</small></div>
</header>
<main>
<section class="view on" id="v-carte">
 <div class="chips" id="regchips"></div>
 <div id="mapwrap"><svg id="map" viewBox="0 0 960 500"></svg>
  <div class="zoom"><button id="zin" aria-label="Zoomer">+</button><button id="zout" aria-label="Dézoomer">−</button></div></div>
 <div class="chips" id="presets"></div>
 <div class="ctl"><button id="prev" aria-label="Événement précédent">‹</button><input type="range" id="yr" min="0" max="1000" value="1000"><button id="next" aria-label="Événement suivant">›</button></div>
 <div class="row"><button class="chip" id="play">▶ Lecture</button><span id="ylab"></span><button class="chip sel" id="inftg">Influences</button></div>
 <div class="legend"><span><b></b>influence</span><span><b style="border-top:2px dashed #C62F3F"></b>contre-modèle / réaction</span><span><b style="border-top:2px dotted #999"></b>discutée</span></div>
 <p class="small" id="mapinfo"></p>
</section>
<section class="view" id="v-frise"><div class="chips" id="regchips2"></div><div class="chips" id="tagchips"></div><div id="frise"></div></section>
<section class="view" id="v-themes"><p class="small">Thèmes parents (ce qui englobe ou précède) et thèmes contradictoires (ce qui conteste). Touchez un événement pour le voir sur la carte.</p><div id="themes"></div></section>
<section class="view" id="v-quiz"><div id="quiz"></div></section>
<section class="view" id="v-plus"><div class="chips" id="plustabs"></div><div id="plus"></div></section>
</main>
<nav class="bar">
 <button data-v="carte" class="on"><span>🗺️</span>Carte</button>
 <button data-v="frise"><span>📜</span>Frise</button>
 <button data-v="themes"><span>⚖️</span>Thèmes</button>
 <button data-v="quiz"><span>❓</span>Quiz</button>
 <button data-v="plus"><span>☰</span>Plus</button>
</nav>
<div id="sheet"><div class="hd"><h2 id="shtitle"></h2><button class="x" id="shx" aria-label="Fermer">✕</button></div><div class="bd" id="shbody"></div></div>
<script src="data.js"></script><script src="map.js"></script><script src="synth.js"></script><script src="app.js"></script>
</body>
